<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coming Soon | SbArt&Designs Annex-Tadzewu</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body { 
            font-family: 'Poppins', sans-serif; 
            min-height: 100vh; 
            width: 100%; 
            overflow-x: hidden; 
            color: white; 
            background: #0a0e1a;
            scroll-behavior: smooth;
        }

        /* Background matching the main site */
        .bg-layer {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(255, 107, 157, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(255, 140, 66, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 80, 120, 0.08) 0%, transparent 60%),
                linear-gradient(-45deg, #0a0e1a, #1a0f1a, #0f0a14, #1a0f0a, #0a0e1a);
            background-size: 100% 100%, 100% 100%, 100% 100%, 400% 400%;
            animation: animateBG 15s ease infinite;
            z-index: 0;
        }

        @keyframes animateBG { 
            0% { background-position: 0% 0%, 100% 100%, 50% 50%, 0% 50%; } 
            50% { background-position: 100% 100%, 0% 0%, 50% 50%, 100% 50%; } 
            100% { background-position: 0% 0%, 100% 100%, 50% 50%, 0% 50%; } 
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
        }

        .orb-1 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #ff6b9d 0%, transparent 70%);
            top: -100px; right: -100px;
            animation: floatOrb1 12s ease-in-out infinite;
        }

        .orb-2 {
            width: 350px; height: 350px;
            background: radial-gradient(circle, #fc913a 0%, transparent 70%);
            bottom: -80px; left: -80px;
            animation: floatOrb2 15s ease-in-out infinite;
        }

        .orb-3 {
            width: 300px; height: 300px;
            background: radial-gradient(circle, #ff4e50 0%, transparent 70%);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation: floatOrb3 18s ease-in-out infinite;
        }

        @keyframes floatOrb1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-50px, 80px) scale(1.1); }
            66% { transform: translate(30px, -40px) scale(0.9); }
        }

        @keyframes floatOrb2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(60px, -60px) scale(1.2); }
            66% { transform: translate(-40px, 30px) scale(0.85); }
        }

        @keyframes floatOrb3 {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.15; }
        }

        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            max-width: 600px;
            margin: 0 auto;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 30px;
            filter: drop-shadow(0 4px 15px rgba(0,0,0,0.3));
            opacity: 0;
            animation: fadeIn 1s ease forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .brand-name {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5), 0 0 30px rgba(255,107,157,0.2);
            letter-spacing: -0.5px;
            opacity: 0;
            animation: fadeIn 1s ease 0.3s forwards;
        }

        .brand-sub {
            font-size: 0.95rem;
            font-weight: 500;
            opacity: 0.9;
            margin-bottom: 40px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
            opacity: 0;
            animation: fadeIn 1s ease 0.5s forwards;
        }

        .typewriter-box {
            background: rgba(20, 20, 35, 0.6); 
            backdrop-filter: blur(40px) saturate(180%); 
            -webkit-backdrop-filter: blur(40px) saturate(180%); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 28px; 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 0 0 0.5px rgba(255, 255, 255, 0.05);
            width: 100%;
            padding: 35px 28px;
            text-align: center;
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: fadeIn 1s ease 0.7s forwards;
        }

        .typewriter-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, transparent 100%);
            border-radius: 28px 28px 0 0;
            pointer-events: none;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 18px;
            background: rgba(255, 107, 157, 0.15);
            border: 1px solid rgba(255, 107, 157, 0.3);
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #ff8fab;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
            opacity: 0;
            animation: fadeIn 1s ease 0.9s forwards;
        }

        .typewriter-text {
            font-size: 1.05rem;
            font-weight: 400;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.92);
            min-height: 120px;
            position: relative;
            z-index: 1;
            text-align: left;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background: #ff8fab;
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 0.8s step-end infinite;
        }

        .cursor.done {
            animation: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .contact-section {
            margin-top: 30px;
            width: 100%;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease;
        }

        .contact-section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .contact-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 15px;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        .contact-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .contact-card {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 24px;
            border-radius: 20px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.15);
            width: 100%;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            position: relative;
            overflow: hidden;
        }

        .contact-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, transparent 50%);
            pointer-events: none;
            border-radius: 20px;
        }

        .contact-card:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(0,0,0,0.4);
        }

        .contact-card:active {
            transform: scale(0.97);
        }

        .contact-card svg {
            width: 22px;
            height: 22px;
            fill: white;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .whatsapp-card {
            background: linear-gradient(45deg, #00b894, #0a0e1a, #00b894, #0a0e1a);
            background-size: 300% 300%;
            animation: calcGradientShift 8.3s ease infinite;
        }

        @keyframes calcGradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .tiktok-card {
            background: linear-gradient(45deg, #0a0e1a, #FE2C55, #25F4EE, #FE2C55, #0a0e1a);
            background-size: 400% 400%;
            animation: tiktokGradient 7.4s ease infinite;
        }

        @keyframes tiktokGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .footer { 
            margin-top: 30px; 
            padding: 14px 0 5px 0; 
            font-size: 0.85rem; 
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
            border-top: 1px solid rgba(255,255,255,0.1);
            position: relative;
            z-index: 1;
            font-weight: 500;
            width: 100%;
            text-align: center;
            opacity: 0;
            animation: fadeIn 1s ease 1.1s forwards;
        }

        .footer-heart { 
            color: #ff6b9d; 
            animation: heartbeat 1.2s ease-in-out infinite; 
            display: inline-block; 
            filter: drop-shadow(0 0 4px rgba(255, 107, 157, 0.5));
        }

        @keyframes heartbeat { 
            0%, 100% { transform: scale(1); } 
            50% { transform: scale(1.25); } 
        }

        @media (max-width: 480px) { 
            .brand-name { font-size: 1.4rem; } 
            .typewriter-box { padding: 28px 20px; border-radius: 24px; }
            .typewriter-text { font-size: 0.95rem; }
            .logo { width: 70px; height: 70px; }
        }

        @media (max-width: 360px) {
            .typewriter-box { padding: 24px 16px; }
            .typewriter-text { font-size: 0.9rem; }
        }
    </style>
</head>

    <script>
        const message = `Hey there! 👋\n\nWe\'re currently working behind the scenes to bring you an even better experience. Our website is temporarily unavailable as we make some important updates and improvements.\n\nWe apologize for any inconvenience this may cause. Your patience means the world to us, and we can\'t wait to show you what\'s coming!\n\nIn the meantime, feel free to reach out to us directly through any of the channels below. We\'d love to hear from you and answer any questions you may have.\n\nThank you for your understanding. 🙏`;

        const typedText = document.getElementById('typed-text');
        const cursor = document.getElementById('cursor');
        const contactSection = document.getElementById('contactSection');

        let index = 0;
        let isTyping = true;

        function typeWriter() {
            if (index < message.length) {
                const char = message.charAt(index);

                if (char === '\n') {
                    typedText.innerHTML += '<br>';
                } else {
                    typedText.textContent += char;
                }

                index++;

                // Variable typing speed for natural feel
                let speed = 30;
                if (char === '.' || char === '!' || char === '?') speed = 350;
                else if (char === ',') speed = 150;
                else if (char === ' ') speed = 40;

                setTimeout(typeWriter, speed);
            } else {
                // Typing done — fade out cursor and show contacts
                setTimeout(() => {
                    cursor.classList.add('done');
                    contactSection.classList.add('visible');
                }, 800);
            }
        }

        // Start typing after a brief delay
        setTimeout(typeWriter, 1200);
    </script>
